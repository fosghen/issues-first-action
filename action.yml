name: Strict Issues First
description: Require exactly one older, same-repository issue for every pull request.
inputs:
  token:
    description: Read-only GitHub token.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Validate issue provenance
      shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
      run: cd "$GITHUB_ACTION_PATH" && python3 -m src.entrypoint
